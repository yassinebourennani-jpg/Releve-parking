<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Relevés Parking</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1b2430;--mut:#6b7686;--pri:#1f3a5f;--acc:#e8a317;--ok:#1e8e3e;--ko:#c62828;--line:#dde2e9}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{background:var(--pri);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
header small{opacity:.8}
main{padding:12px;max-width:900px;margin:auto}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font-size:14px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{padding:14px 0;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:18px;font-weight:700;color:var(--pri)}
.lv.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn{border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:600;background:var(--pri);color:#fff}
.btn.sec{background:#e6eaf0;color:var(--pri)}
.btn.ko{background:var(--ko)}
.btn.ok{background:var(--ok)}
.btn.block{width:100%}
.fab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:18px;font-size:18px;background:var(--acc);color:#1b2430;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:6}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.stats{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.stats b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
td.plate{font-weight:700;font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
tr.item{cursor:pointer}
img.th{width:44px;height:44px;object-fit:cover;border-radius:6px;display:block}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.sheet img.prev{width:100%;max-height:34vh;object-fit:contain;background:#111;border-radius:10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=datetime-local]{width:100%;padding:13px;font-size:17px;border:2px solid var(--line);border-radius:10px}
input.plate{font-family:ui-monospace,Consolas,monospace;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:22px;text-align:center}
.ocr{font-size:13px;margin-top:6px;color:var(--mut);min-height:18px}
.ocr.ok{color:var(--ok);font-weight:600}
.ocr.ko{color:#7a5b00}
.warn{background:#fff3cd;color:#7a5b00;padding:8px 10px;border-radius:8px;font-size:13px;margin-top:8px;display:none}
select.flt{padding:10px;font-size:15px;border-radius:8px;border:2px solid var(--line)}
#report{display:none}
@media print{
  body>*:not(#report){display:none!important}
  #report{display:block}
  body{background:#fff;padding:0}
  #report h1{font-size:18px;margin:0 0 4px}
  #report p{margin:0 0 10px;font-size:12px}
  #report table{font-size:12px}
  #report th,#report td{border:1px solid #888;padding:5px}
  #report img{width:70px;height:50px;object-fit:cover}
  tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <h1>Relevés Parking</h1>
  <small id="sub">Hors ligne · données stockées sur ce téléphone</small>
</header>

<main>
  <div class="card">
    <h2>Niveau en cours</h2>
    <div class="levels" id="levels"></div>
  </div>

  <div class="card">
    <div class="stats" id="stats"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn sec" id="bCsv">Export CSV</button>
      <button class="btn sec" id="bPrint">Rapport / PDF</button>
    </div>
    <div class="row" style="margin-top:8px;align-items:center">
      <button class="btn sec" id="bOcr">Préparer la lecture auto</button>
      <small id="ocrState" style="color:var(--mut)">Avec réseau, une seule fois</small>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn sec" id="bSave">Sauvegarde JSON</button>
      <button class="btn sec" id="bLoad">Restaurer</button>
      <button class="btn ko" id="bClear">Tout effacer</button>
    </div>
    <input type="file" id="fLoad" accept="application/json" hidden>
  </div>

  <div class="card">
    <div class="row" style="align-items:center;margin-bottom:8px">
      <h2 style="margin:0;flex:2">Relevés</h2>
      <select class="flt" id="flt"></select>
    </div>
    <div id="list"></div>
  </div>
</main>

<button class="btn fab" id="bPhoto">📷 Prendre une photo</button>
<input type="file" id="fPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" hidden>

<div class="modal" id="modal">
  <div class="sheet">
    <img class="prev" id="prev" alt="">
    <label>Niveau de parking</label>
    <div class="levels" id="fLevels"></div>
    <label>Immatriculation</label>
    <input type="text" id="fPlate" class="plate" placeholder="AB-123-CD" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="ocr" id="ocrStat"></div>
    <div class="warn" id="warn"></div>
    <label>Modèle du véhicule</label>
    <input type="text" id="fModel" placeholder="ex : Renault Clio" autocomplete="off">
    <label>Date et heure</label>
    <input type="datetime-local" id="fDate">
    <div class="row" style="margin-top:14px">
      <button class="btn sec" id="mCancel">Annuler</button>
      <button class="btn ko" id="mDel" style="display:none">Supprimer</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn ok" id="mSave">Enregistrer</button>
      <button class="btn" id="mNext">Enregistrer + photo suivante</button>
    </div>
  </div>
</div>

<div id="report"></div>

<script>
const LEVELS=["-1 h","-1 b","-2 h","-2 b","-3 h","-3 b"];
let db,current=localStorage.getItem("lvl")||LEVELS[0],filter="all",editing=null,pendingPhoto=null,pendingDate=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open("releves-parking",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("releves",{keyPath:"id",autoIncrement:true});
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);
});}
const tx=(m)=>db.transaction("releves",m).objectStore("releves");
const all=()=>new Promise(r=>{const q=tx("readonly").getAll();q.onsuccess=()=>r(q.result)});
const put=o=>new Promise(r=>{const q=tx("readwrite").put(o);q.onsuccess=()=>r(q.result)});
const del=id=>new Promise(r=>{const q=tx("readwrite").delete(id);q.onsuccess=()=>r()});
const clr=()=>new Promise(r=>{const q=tx("readwrite").clear();q.onsuccess=()=>r()});

/* ---------- utilitaires ---------- */
function fmtPlate(p){
  p=p.toUpperCase().replace(/[\s.-]/g,"");
  return /^[A-Z]{2}\d{3}[A-Z]{2}$/.test(p)?p.slice(0,2)+"-"+p.slice(2,5)+"-"+p.slice(5):p;
}
const keyPlate=p=>p.toUpperCase().replace(/[^A-Z0-9]/g,"");
const fmtDate=t=>new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
function toLocalInput(t){const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function compress(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
    const M=1600,s=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);
    c.toBlob(b=>b?res(b):rej(),"image/jpeg",.8);
  };
  img.onerror=()=>rej();img.src=u;
});}
function download(name,blob){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- niveaux ---------- */
function drawLevels(box,sel,onPick){
  box.innerHTML="";
  LEVELS.forEach(l=>{
    const b=document.createElement("button");b.className="lv"+(l===sel?" on":"");b.textContent=l;
    b.onclick=()=>onPick(l);box.appendChild(b);
  });
}
function setCurrent(l){current=l;localStorage.setItem("lvl",l);drawLevels($("levels"),current,setCurrent)}

/* ---------- liste ---------- */
async function refresh(){
  const data=(await all()).sort((a,b)=>b.date-a.date);
  const f=$("flt");const prev=f.value||"all";
  f.innerHTML='<option value="all">Tous les niveaux</option>'+LEVELS.map(l=>`<option value="${l}">${l}</option>`).join("");
  f.value=prev;filter=f.value;
  const counts={};LEVELS.forEach(l=>counts[l]=0);data.forEach(d=>counts[d.level]=(counts[d.level]||0)+1);
  $("stats").innerHTML=`<span><b>${data.length}</b> total</span>`+LEVELS.map(l=>`<span>${l}: <b>${counts[l]}</b></span>`).join("");
  const rows=data.filter(d=>filter==="all"||d.level===filter);
  if(!rows.length){$("list").innerHTML='<div class="empty">Aucun relevé.<br>Appuie sur « Prendre une photo ».</div>';return}
  $("list").innerHTML='<table><thead><tr><th></th><th>Plaque</th><th>Modèle</th><th>Niv.</th><th>Date</th></tr></thead><tbody>'+
   rows.map(d=>`<tr class="item" data-id="${d.id}"><td>${d.photo?`<img class="th" src="${URL.createObjectURL(d.photo)}">`:""}</td><td class="plate">${esc(d.plate)}</td><td>${esc(d.model)}</td><td>${esc(d.level)}</td><td>${fmtDate(d.date)}</td></tr>`).join("")+
   '</tbody></table>';
  document.querySelectorAll("tr.item").forEach(tr=>tr.onclick=()=>openEdit(+tr.dataset.id));
}
$("flt").onchange=refresh;

/* ---------- formulaire ---------- */
let formLevel=current,previewURL=null;
function drawFormLevels(){drawLevels($("fLevels"),formLevel,l=>{formLevel=l;drawFormLevels()})}
function showForm(rec){
  editing=rec&&rec.id?rec:null;
  formLevel=rec?rec.level:current;
  drawFormLevels();
  const blob=rec?rec.photo:pendingPhoto;
  if(previewURL)URL.revokeObjectURL(previewURL);
  if(blob){previewURL=URL.createObjectURL(blob);$("prev").src=previewURL;$("prev").style.display="block"}else $("prev").style.display="none";
  $("fPlate").value=rec?rec.plate:"";
  $("fModel").value=rec?rec.model:"";
  $("fDate").value=toLocalInput(rec?rec.date:(pendingDate||Date.now()));
  $("mDel").style.display=editing?"block":"none";
  $("mNext").style.display=editing?"none":"block";
  $("warn").style.display="none";
  setOcr("","");
  $("modal").classList.add("show");
  setTimeout(()=>$("fPlate").focus(),200);
  if(!rec&&pendingPhoto)autoRead(pendingPhoto);
}
async function openEdit(id){const r=(await all()).find(x=>x.id===id);if(r)showForm(r)}
function closeForm(){$("modal").classList.remove("show");pendingPhoto=null;editing=null}
$("fPlate").addEventListener("input",async()=>{
  const k=keyPlate($("fPlate").value);const w=$("warn");
  if(k.length<5){w.style.display="none";return}
  const dup=(await all()).filter(d=>keyPlate(d.plate)===k&&(!editing||d.id!==editing.id));
  if(dup.length){w.textContent="Déjà relevé : "+dup.map(d=>d.level+" ("+fmtDate(d.date)+")").join(" · ");w.style.display="block"}else w.style.display="none";
});
async function saveForm(next){
  const plate=fmtPlate($("fPlate").value.trim());
  if(!plate){alert("Saisis l'immatriculation.");return}
  const rec={plate,model:$("fModel").value.trim(),level:formLevel,
    date:$("fDate").value?new Date($("fDate").value).getTime():Date.now(),
    photo:editing?editing.photo:pendingPhoto};
  if(editing)rec.id=editing.id;
  await put(rec);
  setCurrent(formLevel);
  closeForm();await refresh();
  if(next)$("fPhoto").click();
}
$("mSave").onclick=()=>saveForm(false);
$("mNext").onclick=()=>saveForm(true);
$("mCancel").onclick=closeForm;
$("mDel").onclick=async()=>{if(editing&&confirm("Supprimer ce relevé ?")){await del(editing.id);closeForm();refresh()}};

/* ---------- lecture automatique de la plaque (OCR) ---------- */
/* Le moteur (Tesseract.js) est téléchargé une fois avec du réseau, puis conservé
   par le service worker et le navigateur. Si la lecture échoue : saisie manuelle. */
const TESS_URL="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
let tessWorker=null,tessLoading=null;
function setOcr(msg,cls){const e=$("ocrStat");e.textContent=msg;e.className="ocr"+(cls?" "+cls:"")}
function loadScript(src){return new Promise((res,rej)=>{
  if(window.Tesseract)return res();
  const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("script"));
  document.head.appendChild(s);
});}
function getWorker(){
  if(tessWorker)return Promise.resolve(tessWorker);
  if(tessLoading)return tessLoading;
  tessLoading=(async()=>{
    await loadScript(TESS_URL);
    const w=await Tesseract.createWorker("eng",1,{});
    await w.setParameters({
      tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-",
      tessedit_pageseg_mode:"11"
    });
    tessWorker=w;localStorage.setItem("ocrReady","1");
    return w;
  })();
  tessLoading.catch(()=>{tessLoading=null});
  return tessLoading;
}
function prepImage(blob,scale,inv){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(blob);
  img.onload=()=>{
    const s=Math.min(scale,1800/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height),p=d.data;
    let lo=255,hi=0;
    for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=g;if(g<lo)lo=g;if(g>hi)hi=g}
    const k=hi>lo?255/(hi-lo):1;
    for(let i=0;i<p.length;i+=4){let g=(p[i]-lo)*k;if(inv)g=255-g;p[i]=p[i+1]=p[i+2]=g}
    x.putImageData(d,0,0);URL.revokeObjectURL(u);res(c);
  };
  img.onerror=()=>rej();img.src=u;
});}
/* Extrait une plaque au format SIV (AB-123-CD) d'un texte brut, en corrigeant les confusions O/0, I/1, S/5, B/8, Z/2 */
const TO_L={"0":"O","1":"I","5":"S","8":"B","2":"Z","6":"G"},TO_D={"O":"0","I":"1","L":"1","S":"5","B":"8","Z":"2","D":"0","G":"6","Q":"0"};
function findPlate(text){
  const t=text.toUpperCase().replace(/[^A-Z0-9]/g,"");
  let best=null;
  for(let i=0;i+7<=t.length;i++){
    const w=t.slice(i,i+7);let exact=/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(w),out="";
    for(let j=0;j<7;j++){
      const ch=w[j],letterSlot=(j<2||j>4);
      if(letterSlot)out+=/[A-Z]/.test(ch)?ch:(TO_L[ch]||"?");
      else out+=/\d/.test(ch)?ch:(TO_D[ch]||"?");
    }
    if(!/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(out))continue;
    if(/[IOU]/.test(out[0]+out[1]+out[5]+out[6])&&!exact)continue;
    if(exact)return out;
    if(!best)best=out;
  }
  return best;
}
async function readPlate(blob){
  const w=await getWorker();
  for(const [scale,inv] of [[1,false],[1.6,false],[1.6,true]]){
    const c=await prepImage(blob,scale,inv);
    const r=await w.recognize(c);
    const p=findPlate(r.data.text||"");
    if(p)return p;
  }
  return null;
}
async function autoRead(blob){
  if(!window.Tesseract&&!navigator.onLine&&!localStorage.getItem("ocrReady")){
    setOcr("Lecture auto non préparée : saisie manuelle.","ko");return;
  }
  setOcr("Lecture de la plaque…","");
  try{
    const p=await Promise.race([readPlate(blob),new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),45000))]);
    if(pendingPhoto!==blob||!$("modal").classList.contains("show"))return;
    if(p&&!$("fPlate").value.trim()){
      $("fPlate").value=fmtPlate(p);$("fPlate").dispatchEvent(new Event("input"));
      setOcr("Plaque lue automatiquement : à vérifier.","ok");
    }else if(!p)setOcr("Plaque non reconnue : saisie manuelle.","ko");
    else setOcr("","");
  }catch(err){
    if(pendingPhoto===blob)setOcr("Lecture auto indisponible : saisie manuelle.","ko");
  }
}
$("bOcr").onclick=async()=>{
  const st=$("ocrState");st.textContent="Téléchargement…";$("bOcr").disabled=true;
  try{await getWorker();st.textContent="Prête : fonctionne hors ligne"}
  catch{st.textContent="Échec : vérifie le réseau"}
  $("bOcr").disabled=false;
};
if(localStorage.getItem("ocrReady"))$("ocrState").textContent="Prête : fonctionne hors ligne";

/* ---------- photo ---------- */
$("bPhoto").onclick=()=>$("fPhoto").click();
$("fPhoto").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{pendingPhoto=await compress(f)}catch{pendingPhoto=f}
  pendingDate=Date.now();
  showForm(null);
};

/* ---------- exports ---------- */
async function sorted(){
  const o=l=>LEVELS.indexOf(l);
  return (await all()).sort((a,b)=>o(a.level)-o(b.level)||a.date-b.date);
}
$("bCsv").onclick=async()=>{
  const d=await sorted();if(!d.length)return alert("Aucun relevé.");
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv="\uFEFF"+["Date;Modèle;Immatriculation;Niveau parking",...d.map(r=>[q(fmtDate(r.date)),q(r.model),q(r.plate),q(r.level)].join(";"))].join("\r\n");
  download("releves-parking-"+new Date().toISOString().slice(0,10)+".csv",new Blob([csv],{type:"text/csv;charset=utf-8"}));
};
$("bPrint").onclick=async()=>{
  const d=await sorted();if(!d.length)return alert("Aucun relevé.");
  const withPhotos=confirm("Inclure les photos dans le rapport ?\n\nOK = avec photos · Annuler = sans photos");
  const urls=[];
  const rows=d.map(r=>{
    let img="";if(withPhotos&&r.photo){const u=URL.createObjectURL(r.photo);urls.push(u);img=`<td><img src="${u}"></td>`}else if(withPhotos)img="<td></td>";
    return `<tr><td>${fmtDate(r.date)}</td><td>${esc(r.model)}</td><td><b>${esc(r.plate)}</b></td><td>${esc(r.level)}</td>${img}</tr>`;
  }).join("");
  $("report").innerHTML=`<h1>Relevé des immatriculations — Parking</h1><p>Édité le ${fmtDate(Date.now())} · ${d.length} véhicule(s)</p><table><thead><tr><th>Date</th><th>Modèle</th><th>Immatriculation</th><th>Niveau parking</th>${withPhotos?"<th>Photo</th>":""}</tr></thead><tbody>${rows}</tbody></table>`;
  const imgs=[...$("report").querySelectorAll("img")];
  await Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  window.print();
};
$("bSave").onclick=async()=>{
  const d=await all();if(!d.length)return alert("Aucun relevé.");
  const out=await Promise.all(d.map(r=>new Promise(res=>{
    if(!r.photo)return res({...r,photo:null});
    const fr=new FileReader();fr.onload=()=>res({...r,photo:fr.result});fr.readAsDataURL(r.photo);
  })));
  download("sauvegarde-releves-"+new Date().toISOString().slice(0,10)+".json",new Blob([JSON.stringify(out)],{type:"application/json"}));
};
$("bLoad").onclick=()=>$("fLoad").click();
$("fLoad").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const arr=JSON.parse(await f.text());let n=0;
    for(const r of arr){
      delete r.id;
      if(r.photo)r.photo=await (await fetch(r.photo)).blob();
      await put(r);n++;
    }
    alert(n+" relevé(s) restauré(s).");refresh();
  }catch{alert("Fichier invalide.")}
};
$("bClear").onclick=async()=>{
  if(confirm("Effacer TOUS les relevés de ce téléphone ?\nFais d'abord un export ou une sauvegarde.")&&confirm("Confirmer l'effacement définitif ?")){await clr();refresh()}
};

/* ---------- démarrage ---------- */
(async()=>{
  await openDB();
  setCurrent(LEVELS.includes(current)?current:LEVELS[0]);
  refresh();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
})();
</script>
